<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>ERRO 403</title>
  <link rel="shortcut icon" href="graphic/icons/nwfavicon.ico" type="image/x-icon" />
  <meta name="description" content="Noblewars - um jogo de navegador online. Cada jogador tem uma pequena aldeia para levar ao poder e a glória." />
  <style>
    /* Fundo escuro com textura sutil de pedra */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #1a140f;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(40, 30, 20, 0.3) 1px, transparent 1px),
        radial gradiente(circle at 90% 80%, rgba(60, 45, 30, 0.2) 1px, transparent 1px);
      background-size: 80px 80px;
      font-family: 'Cinzel', 'Georgia', serif;
      color: #e8d9b9;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Importa fonte medieval elegante do Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

    .medieval-card {
      background: linear-gradient(135deg, #2c221a 0%, #3b2e23 100%);
      border: 2px solid #8b6f4e;
      border-radius: 12px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.7),
        inset 0 0 15px rgba(139, 111, 78, 0.3);
      padding: 40px 30px;
      width: 90%;
      max-width: 500px;
      position: relative;
      overflow: hidden;
    }

    .medieval-card::before {
      content: "♔";
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 24px;
      opacity: 0.4;
    }

    .medieval-card::after {
      content: "⚔️";
      position: absolute;
      bottom: 15px;
      right: 15px;
      font-size: 20px;
      opacity: 0.4;
    }

    .medieval-card h1 {
      font-size: 56px;
      margin: 0 0 10px;
      color: #d4af37; /* Dourado real */
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      letter-spacing: 2px;
    }

    .medieval-card h2 {
      font-size: 26px;
      margin: 0 0 25px;
      font-weight: 400;
      color: #e8d9b9;
    }

    .medieval-card p {
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
    }

    .medieval-card a {
      color: #d4af37;
      text-decoration: none;
      font-weight: 700;
      border-bottom: 1px solid #d4af37;
      padding-bottom: 2px;
      transition: color 0.3s;
    }

    .medieval-card a:hover {
      color: #f5e6ba;
    }

    /* Responsividade suave */
    @media (max-width: 500px) {
      .medieval-card h1 { font-size: 44px; }
      .medieval-card h2 { font-size: 22px; }
      .medieval-card { padding: 30px 20px; }
    }
  </style>
  <script>
    if (top != self) top.location = self.location;
  </script>
</head>
<body>
  <div class="medieval-card">
    <h1>403</h1>
    <h2>Acesso Negado</h2>
    <p>
      Se caíste nesta página por engano,<br/>
      contacta <a href="https://ice41.pt">ice41</a>.
    </p>
  </div>
</body>
</html>
